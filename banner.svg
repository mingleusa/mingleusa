<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jordan Mingle — Fullstack Developer, Pennsylvania" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15171F"/>
      <stop offset="100%" stop-color="#1B1E29"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- PCB trace lines: right-angle paths with solder-pad junctions, nodding to bench repair roots -->
  <g fill="none" stroke="#E3A33E" stroke-width="2" opacity="0.55">
    <path d="M 0 40 H 140 V 90 H 300"/>
    <path d="M 0 230 H 90 V 190 H 260"/>
    <path d="M 1200 60 H 1040 V 20"/>
    <path d="M 1200 200 H 1080 V 240 H 940"/>
    <path d="M 1200 130 H 1120 V 170 H 1000"/>
  </g>
  <g fill="#E3A33E" opacity="0.85">
    <circle cx="140" cy="40" r="3.5"/>
    <circle cx="300" cy="90" r="3.5"/>
    <circle cx="90" cy="230" r="3.5"/>
    <circle cx="260" cy="190" r="3.5"/>
    <circle cx="1040" cy="60" r="3.5"/>
    <circle cx="940" cy="240" r="3.5"/>
    <circle cx="1000" cy="170" r="3.5"/>
  </g>

  <!-- Wordmark -->
  <text x="70" y="140" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="52" font-weight="700" letter-spacing="1" fill="#F2F0EA">JORDAN MINGLE</text>

  <!-- Trace-style underline ending in a solder pad, connecting wordmark to tagline -->
  <path d="M 70 162 H 520 V 178" fill="none" stroke="#4FD1C5" stroke-width="2.5"/>
  <circle cx="520" cy="178" r="4" fill="#4FD1C5"/>

  <!-- Tagline -->
  <text x="70" y="212" font-family="'Inter', 'Segoe UI', sans-serif" font-size="22" fill="#9CA3AF">Fullstack developer, Pennsylvania — bench repair roots, now building Dev Thunder</text>
</svg>
